<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finanzas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- BARRA SUPERIOR SOLO CON MENÚ -->
    <header class="navbar">
        <button id="btnMenu" class="hamburger-btn">☰</button>
    </header>

    <!-- MENÚ LATERAL -->
    <nav id="sideMenu" class="side-menu hidden">
        <button id="btnCloseMenu" class="close-btn">&times;</button>
        <ul>
            <li><a href="#" id="menuGasto" class="active">Registrar Gasto</a></li>
            <li><a href="#" id="menuIngreso">Registrar Ingreso</a></li>
            <li><a href="#" id="menuMetricas">Balance y Métricas</a></li>
        </ul>
    </nav>
    <div id="overlay" class="overlay hidden"></div>

    <div class="container">
        
        <!-- VISTA PRINCIPAL: FORMULARIO ÚNICO -->
        <section id="vistaFormulario">
            <form id="registroForm">
                <div class="form-group">
                    <input type="text" id="concepto" placeholder="Concepto" required>
                </div>
                
                <div class="form-group">
                    <input type="number" id="monto" placeholder="Monto" required>
                </div>
                
                <button type="submit" id="btnSubmit">Registrar Gasto</button>
            </form>
        </section>

        <!-- VISTA MÉTRICAS (Elegante y sin colores fuertes) -->
        <section id="vistaMetricas" class="hidden">
            <div class="card balance-card">
                <h3>Balance Real</h3>
                <span id="lblBalance" class="monto-destacado">$0</span>
            </div>

            <div class="metricas-grid">
                <div class="card">
                    <h4>Ingresos</h4>
                    <span id="lblIngresos">$0</span>
                </div>
                <div class="card">
                    <h4>Gastos</h4>
                    <span id="lblGastos">$0</span>
                </div>
            </div>

            <button id="btnActualizarMetricas" class="btn-secondary" style="margin-top: 15px;">Actualizar Cifras</button>
        </section>

        <div id="mensaje" class="hidden"></div>
    </div>

    <!-- MODAL -->
    <div id="modalCategoria" class="modal hidden">
        <div class="modal-content">
            <h2>Clasificar</h2>
            <p>Categoría para "<span id="conceptoModal"></span>":</p>
            <select id="selectCategoria"></select>
            <button id="btnGuardarCategoria" class="btn-primary">Guardar</button>
            <button id="btnCancelarModal" class="btn-secondary">Cancelar</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
