<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Finanzas</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>💸 Nuevo Gasto</h1>
        
        <form id="gastoForm">
            <div class="form-group">
                <label for="concepto">Concepto</label>
                <input type="text" id="concepto" placeholder="Ej: Supermercado, UTE..." required>
            </div>
            
            <div class="form-group">
                <label for="monto">Monto ($)</label>
                <input type="number" id="monto" placeholder="Ej: 1500" required>
            </div>
            
            <button type="submit" id="btnSubmit">Registrar Gasto</button>
        </form>

        <div id="mensaje" class="hidden"></div>
    </div>

    <!-- MODAL DE APRENDIZAJE (Oculto por defecto) -->
    <div id="modalCategoria" class="modal hidden">
        <div class="modal-content">
            <h2>¡Nuevo Gasto detectado! 🤔</h2>
            <p>Aún no sé a qué categoría pertenece <strong>"<span id="conceptoModal"></span>"</strong>.</p>
            <p>¿En dónde lo agrupo para la próxima vez?</p>
            
            <select id="selectCategoria"></select>
            
            <button id="btnGuardarCategoria" class="btn-primary">Aprender y Guardar</button>
            <button id="btnCancelarModal" class="btn-secondary">Cancelar</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
