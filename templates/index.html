<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Finanzas | Registro Inteligente</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1 class="title">Control Financiero</h1>
        <p class="subtitle">Registro Diario de Gastos</p>

        <div class="card">
            <form id="gasto-form">
                <label for="concepto">¿Qué compraste / pagaste?</label>
                <input type="text" id="concepto" placeholder="Ej: manteca, UTE, nafta..." required autocomplete="off">

                <label for="monto">¿Cuánto fue?</label>
                <div class="input-group">
                    <span class="currency">$</span>
                    <input type="number" id="monto" placeholder="0" required min="1">
                </div>

                <button type="submit" class="btn-gasto">REGISTRAR GASTO</button>
            </form>
            
            <div id="resultado" class="oculto">
                <p id="mensaje-exito"></p>
                <p id="detalle-categoria" class="badge"></p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
